<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Register — ShieldHer</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="bg-blob blob1"></div>
  <div class="bg-blob blob2"></div>

  <div class="auth-wrap">
    <div class="glass-lg auth-card">
      <div class="auth-header">
        <div class="auth-icon">🌸</div>
        <h1 class="auth-title">Create Account</h1>
        <p class="auth-sub">Join ShieldHer for your safety</p>
      </div>

      {% with messages = get_flashed_messages() %}
        {% if messages %}
          <div class="flash-msg">{{ messages[0] }}</div>
        {% endif %}
      {% endwith %}

      <form method="POST" action="/register">
        <div class="form-group">
          <label>Username</label>
          <input type="text" name="username" placeholder="Choose a username" required>
        </div>
        <div class="form-group">
          <label>Email <span style="color:var(--muted);font-size:11px;">(optional)</span></label>
          <input type="email" name="email" placeholder="your@email.com">
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" name="password" placeholder="Create a strong password" required>
        </div>
        <button type="submit" class="btn btn-primary" style="margin-top:8px;">Create Account →</button>
      </form>

      <div class="auth-footer">
        Already have an account? <a href="/login">Login</a>
      </div>
    </div>
  </div>
</body>
</html>
